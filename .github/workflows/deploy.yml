name: Deploy Ankurah Exams

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🏗️ Build Frontend (Vite)
        run: |
          cd frontend
          npm install
          npm run build
        env:
          VITE_API_URL: https://ankurahexams.com/api

      - name: 🚀 Deploy Frontend via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: frontend/dist/
          server-dir: ankurahexams.com/

      - name: 🚀 Deploy Backend Source via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: backend/
          server-dir: ankurah-backend/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/uploads/**
            **/.env
            **/backend.zip
            **/stderr.log

      - name: 📝 Create restart trigger
        run: |
          mkdir -p .github/restart
          echo "$(date)" > .github/restart/restart.txt

      - name: 🔄 Restart Backend via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: .github/restart/
          server-dir: ankurah-backend/tmp/
          dangerous-clean-slate: false
